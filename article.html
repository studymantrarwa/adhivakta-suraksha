<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>लेख | अधिवक्ता सुरक्षा आंदोलन</title><meta name="description" content="अधिवक्ता सुरक्षा आंदोलन के लेख और सूचनाएं।"><link rel="stylesheet" href="/assets/style.css"><style>.article-wrap{max-width:900px;margin:0 auto;padding:34px 20px 60px}.article-meta{color:#65748b;margin:12px 0 24px}.article-body{font-size:1.08rem;line-height:1.95;overflow-wrap:anywhere}.article-body p{margin:0 0 1.2em}.article-feature-image{display:block;width:100%;max-width:100%;max-height:560px;object-fit:contain;border-radius:16px;margin:0 auto 28px;background:#f2f4f7}.article-error{padding:24px;border-radius:14px;background:#fff4e8;color:#783d0c}.article-loading{padding:35px;text-align:center}</style></head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="/"><img class="brand-logo" src="/assets/logo.svg" alt="अधिवक्ता सुरक्षा आंदोलन लोगो"><span>अधिवक्ता सुरक्षा आंदोलन<small>Adv. Shivkumar Mishra</small></span></a><a class="admin-link" href="/blog.html">सभी लेख</a></div></header>
<section class="page-hero"><div class="wrap"><span class="eyebrow" id="category">लेख</span><h1 id="title">लेख लोड हो रहा है…</h1><p id="date"></p></div></section><main class="article-wrap"><div id="article"><div class="article-loading">कृपया प्रतीक्षा करें…</div></div><p><a class="btn primary" href="/blog.html">← सभी लेख देखें</a></p></main><footer><div class="wrap copyright">© <span id="year"></span> अधिवक्ता सुरक्षा आंदोलन • Adv. Shivkumar Mishra</div></footer>
<script>(()=>{const slug=new URLSearchParams(location.search).get('slug');const $=id=>document.getElementById(id);$('year').textContent=new Date().getFullYear();const target=$('article');const fail=t=>{target.innerHTML='';const box=document.createElement('div');box.className='article-error';box.textContent=t;target.appendChild(box)};if(!slug){$('title').textContent='लेख नहीं मिला';fail('लेख का लिंक अधूरा है। कृपया लेख सूची से खोलें।');return;}fetch('/api/posts',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('API '+r.status);return r.json()}).then(d=>{const p=(d.posts||[]).find(x=>x.slug===slug&&x.status!=='draft');if(!p){$('title').textContent='लेख उपलब्ध नहीं';fail('यह लेख नहीं मिला या अभी प्रकाशित नहीं है।');return;}document.title=p.title+' | अधिवक्ता सुरक्षा आंदोलन';$('title').textContent=p.title;$('category').textContent=p.category||'लेख';$('date').textContent='प्रकाशित: '+(p.date||'');target.innerHTML='';if(p.image){const img=document.createElement('img');img.className='article-feature-image';img.src=p.image;img.alt=p.title;img.loading='eager';img.onerror=()=>{img.style.display='none';const e=document.createElement('p');e.className='article-error';e.textContent='तस्वीर लोड नहीं हो सकी। व्यवस्थापक Admin Panel में तस्वीर दोबारा अपलोड करके लेख सेव करें।';target.prepend(e)};target.appendChild(img);}const body=document.createElement('div');body.className='article-body';String(p.body||'').split(/\n\s*\n/).filter(Boolean).forEach(t=>{const pEl=document.createElement('p');pEl.textContent=t;body.appendChild(pEl)});target.appendChild(body);}).catch(()=>{$('title').textContent='लेख लोड नहीं हो सका';fail('लेख लोड नहीं हो पाया। कृपया कुछ देर बाद फिर प्रयास करें।');});})();</script></body></html>
